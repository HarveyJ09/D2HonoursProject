<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny 2 User Data</title>
</head>
<body>
    <h1>Destiny 2 User Data</h1>
    {% if user_data %}
        <p>Display Name: {{ user_data['Response']['displayName'] }}</p>
        <p>Membership ID: {{ user_data['Response']['membershipId'] }}</p>
        <p>Profile Picture: <img src="https://www.bungie.net{{ user_data['Response']['profilePicturePath'] }}" alt="Profile Picture"></p>
        <!-- Add more user data fields as needed -->
    {% else %}
        <a href="{{ url_for('login') }}">Login with Bungie</a>
    {% endif %}
</body>
</html>
