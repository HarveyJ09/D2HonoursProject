<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #6e6c6c;
            color: white;
        }
        .container {
            display: flex;
            justify-content: flex-start; /* Aligns content to the left */
        }
        
        .left-section {
            display: flex;
            flex-direction: column;
            width: 50%; /* Takes up half of the space */
        }
        .character-columns {
            display: flex;
            flex-direction: row; /* Keeps the character columns in a row */
            justify-content: space-between; /* Spreads them evenly */
            width: 100%; /* Ensure it spans the full container */
            flex-wrap: nowrap; /* Prevents wrapping */
        }
        
        .column {
            width: 30%; /* Instead of 32% */
            min-width: 200px; /* Ensures enough space for items */
            padding: 20px;
            text-align: left;
        }
        .vault {
            width: 50%; /* Vault takes up half the space */
            padding: 20px;
            
            text-align: left;
        }
        .character-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
        }
        .emblem {
            width: 36px;  /* Adjust width as needed */
            height: auto;   /* Maintain aspect ratio */
            display: block; /* Ensure proper spacing */
        }        
        .power {
            font-size: 22px;
            font-weight: bold;
            color: gold;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-top: 10px;
            font-size: 14px;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            line-height: 20px;
        }
        .stat img {
            width: 20px;
            height: 20px;
        }
        .icon {
            filter: invert(1);
        }
        .item-grid {
            display: flex;
            flex-wrap: wrap; /* Allow items to wrap instead of stacking */
            justify-content: flex-start; /* Align items to the left */
            gap: 10px;
            padding: 10px;
            max-width: 100%; /* Ensure it doesn't overflow */
        }
        
        .item-container {
            box-sizing: border-box;
            contain: layout paint style;
            cursor: grab;
            width: var(--item-size); /* Use the same size as the item */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Align the power at the bottom */
            border: 2px solid white; /* Add a white border around the item */
            background-color: white;
            padding: 4px; /* Add space around the content inside the item */
            gap: 4px; /* Space between the icon and the power */
            margin-bottom: 4px; /* Space between each item */
        }
        
        .item-icon {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
           
        }
        
        .item-power {
            font-size: 14px; /* Adjust the font size for the power */
            color: rgb(26, 25, 25);
            text-align: right;
            width: 100%;
        }
        .store-section {
            background-color: #eeeeee00;
            color: #444;
            cursor: pointer;
            padding: 18px;
            width: 100%;
            text-align: left;
            border: none;
            outline: none;
            transition: 0.4s;
        }
        .active, .store-section:hover {
            background-color: #cccccc00;
        }
        .panel {
            padding: 0 18px;
            background-color: rgba(255, 255, 255, 0);
            display: none;
            overflow: hidden;
        }

        .hunter-category {
            margin-bottom: 20px;
            padding: 10px;
            border: 2px solid #44444400;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0);
            width: 200px; /* Slightly larger than 150px to prevent overflow */
        }
        
        .hunter-category h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #ffcc00;
        }
        
        .category-items {
            display: grid;
            grid-template-columns: repeat(3, 70px); /* 3 columns of 50px each */
            grid-template-rows: repeat(3, 70px); /* 3 rows of 50px each */
            gap: 5px;
            width: 150px; /* Ensure it fits */
            height: auto; /* Maintain grid size */
            justify-content: center;
        }
        
        .hunter-inventory-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0);
            padding: 5px;
            border-radius: 5px;
            width: 50px;
            height: 50px;
        }

        .warlock-category {
            margin-bottom: 20px;
            padding: 10px;
            border: 2px solid #44444400;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0);
            width: 160px; /* Slightly larger than 150px to prevent overflow */
        }
        
        .warlock-category h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #ffcc00;
        }

        .warlock-inventory-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0);
            padding: 5px;
            border-radius: 5px;
            width: 50px;
            height: 50px;
        }
        .titan-category {
            margin-bottom: 20px;
            padding: 10px;
            border: 2px solid #44444400;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0);
            width: 160px; /* Slightly larger than 150px to prevent overflow */
        }
        
        .titan-category h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #ffcc00;
        }

        .titan-inventory-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0);
            padding: 5px;
            border-radius: 5px;
            width: 50px;
            height: 50px;
        }
        
    </style>
</head>
<body>
    <h1 id="welcome-message">Loading...</h1>
    <div class="container">
        <div class="left-section">
            <div class="character-columns">
                <div class="column" id="hunter">
                    <img id="hunter-emblem" class="emblem" src="" alt="Emblem">
                    <h2>Hunter</h2>
                    <div class="character-header">
                        <span class="power" id="hunter-power">Power: --</span>
                    </div>
                    <div class="stats" id="hunter-stats"></div>
                    <div style="margin-top:70px;" id="hunter-inventory-items" class="item-grid"></div>
                </div>
                
                <div class="column" id="warlock">
                    <img id="warlock-emblem" class="emblem" src="" alt="Emblem">
                    <h2>Warlock</h2>
                    <div class="character-header">
                        <span class="power" id="warlock-power">Power: --</span>
                    </div>
                    <div class="stats" id="warlock-stats"></div>
                    <div style="margin-top:70px;" id="warlock-inventory-items" class="item-grid"></div>
                </div>
                
                <div class="column" id="titan">
                    <img id="titan-emblem" class="emblem" src="" alt="Emblem">
                    <h2>Titan</h2>
                    <div class="character-header">
                        <span class="power" id="titan-power">Power: --</span>
                    </div>
                    <div class="stats" id="titan-stats"></div>
                    <div style="margin-top:70px;" id="titan-inventory-items" class="item-grid"></div>
                </div>
            </div>
        </div>

        <div class="vault">
            <h2>Vault</h2>
            <div id="vault-loading" class="loading">Loading vault items...</div>
            <div id="vault-items" class="item-grid"></div>

        </div>
    </div>

    <script>
        var acc = document.getElementsByClassName("store-section");
        var i;

        for (i = 0; i < acc.length; i++) {
        acc[i].addEventListener("click", function() {
            /* Toggle between adding and removing the "active" class,
            to highlight the button that controls the panel */
            this.classList.toggle("active");

            /* Toggle between hiding and showing the active panel */
            var panel = this.nextElementSibling;
            if (panel.style.display === "block") {
            panel.style.display = "none";
            } else {
            panel.style.display = "block";
            }
        });
        }
        
        const params = new URLSearchParams(window.location.search);
        const userName = params.get("user") || "Guardian";
        document.getElementById("welcome-message").textContent = `Welcome, ${userName}!`;
    
        async function fetchCharacterData() {
            try {
                let response = await fetch('/api/characters');
                let data = await response.json();
    
                if (data.error) {
                    document.getElementById("hunter").innerHTML = `<h2>Hunter</h2><p>Error: ${data.error}</p>`;
                    document.getElementById("warlock").innerHTML = `<h2>Warlock</h2><p>Error: ${data.error}</p>`;
                    document.getElementById("titan").innerHTML = `<h2>Titan</h2><p>Error: ${data.error}</p>`;
                    return;
                }
    
                console.log("Character Data:", data);
    
                function updateCharacterUI(classType) {
                    const charData = data.characterData[classType];
    
                    if (!charData) return;
    
                    document.getElementById(`${classType}-emblem`).src = `https://www.bungie.net${charData.emblemPath}`;
                    document.getElementById(`${classType}-power`).textContent = `Power: ${charData.light}`;
    
                    // Define stat IDs and corresponding image paths
                    const statIcons = {
                        "2996146975": "https://raw.githubusercontent.com/justrealmilk/destiny-icons/394ed051455e938f72ddd600d42cf87600ec7172/general/mobility.svg",  // Mobility
                        "392767087": "https://raw.githubusercontent.com/justrealmilk/destiny-icons/394ed051455e938f72ddd600d42cf87600ec7172/general/resilience.svg", // Resilience
                        "1943323491": "https://raw.githubusercontent.com/justrealmilk/destiny-icons/394ed051455e938f72ddd600d42cf87600ec7172/general/recovery.svg",  // Recovery
                        "1735777505": "https://raw.githubusercontent.com/justrealmilk/destiny-icons/394ed051455e938f72ddd600d42cf87600ec7172/general/discipline.svg", // Discipline
                        "144602215": "https://raw.githubusercontent.com/justrealmilk/destiny-icons/394ed051455e938f72ddd600d42cf87600ec7172/general/intellect.svg",  // Intellect
                        "4244567218": "https://raw.githubusercontent.com/justrealmilk/destiny-icons/394ed051455e938f72ddd600d42cf87600ec7172/general/strength.svg"    // Strength
                    };
    
                    let statsHtml = "";
                    for (const [statId, icon] of Object.entries(statIcons)) {
                        let statValue = charData.stats[statId] || "--";
                        statsHtml += `<div class="stat"><img src="${icon}" class="icon" alt=""><span>${statValue}</span></div>`;
                    }
    
                    document.getElementById(`${classType}-stats`).innerHTML = statsHtml;
                }
    
                updateCharacterUI("hunter");
                updateCharacterUI("warlock");
                updateCharacterUI("titan");
    
            } catch (error) {
                console.error("Failed to fetch character data", error);
            }
        }
    
        async function fetchInventoryData(characterType) {
            try {
                let response = await fetch(`/api/${characterType}inventory`, { credentials: 'include' });
                let data = await response.json();
            
                if (data.error) {
                    console.error(`Error fetching ${characterType} inventory data:`, data.error);
                    return;
                }
            
                console.log(`${characterType} Inventory Data:`, data);
            
                let containerId = `${characterType}-inventory-items`;  // Dynamic container ID
                let inventoryContainer = document.getElementById(containerId);
            
                if (!inventoryContainer) {
                    console.error(`Container ${containerId} not found!`);
                    return;
                }
            
                // Clear previous content
                inventoryContainer.innerHTML = "";
            
                // Define bucket categories in the correct order
                const bucketCategories = {
                    1498876634: "Kinetic Weapons",
                    2465295065: "Energy Weapons",
                    953998645: "Power Weapons",
                    3448274439: "Helmet",
                    3551918588: "Gauntlets",
                    14239492: "Chest Armor",
                    20886954: "Leg Armor",
                    1585787867: "Class Armor"
                };
            
                // Create category divs in the correct order first
                let categoryDivs = {};
                for (const bucket in bucketCategories) {
                    let div = document.createElement("div");
                    div.classList.add(`${characterType}-category`, "category");
                    div.id = bucketCategories[bucket];
                    div.innerHTML = `<h3>${bucketCategories[bucket]}</h3>
                        <div class="category-items"></div>`; // Grid container
                    inventoryContainer.appendChild(div);
                    categoryDivs[bucket] = div.querySelector(".category-items"); // Store reference to inner div for items
                }
            
                // Append items to the correct category div
                data.inventoryItems.forEach(item => {
                    let categoryName = bucketCategories[item.bucketHash] || "Unknown";
                    let categoryDiv = categoryDivs[item.bucketHash];
            
                    if (categoryDiv) {
                        let itemDiv = document.createElement("div");
                        itemDiv.classList.add(`${characterType}-inventory-item`);
                        itemDiv.id = categoryName;
                        itemDiv.draggable = false;
                        itemDiv.innerHTML = `
                        <div class="item-container" draggable="true">
                            <img src="${item.icon}" class="item-icon" title="${item.name}"alt="Item" draggable="false">
                            <div class="stat">
                                ${item.dIcon && item.dName ? `<img src="${item.dIcon}" title="${item.dName}" alt="Type" draggable="false">` : ''}
                                <span class="item-power">${item.lightLevel}</span>
                            </div>
                        </div>
                        `;
                        categoryDiv.appendChild(itemDiv); // Append to the correct section
                    }
                });
            
                // Sort categories based on the predefined order
                const order = ["Kinetic Weapons", "Energy Weapons", "Power Weapons", "Helmet", "Gauntlets", "Chest Armor", "Leg Armor", "Class Armor"];
                const categories = inventoryContainer.querySelectorAll('.category');
                const sortedCategories = Array.from(categories).sort((a, b) => {
                    return order.indexOf(a.querySelector('h3').textContent) - order.indexOf(b.querySelector('h3').textContent);
                });
            
                sortedCategories.forEach(category => inventoryContainer.appendChild(category));
            
            } catch (error) {
                console.error(`Failed to fetch ${characterType} inventory data`, error);
            }
        }
   
        async function fetchVaultData() {
            try {
                let response = await fetch('/api/vault', { credentials: 'include' }); // Ensures session cookies are sent
                let data = await response.json();
    
                if (data.error) {
                    console.error("Error fetching vault data:", data.error);
                    return;
                }
    
                let vaultContainer = document.getElementById("vault-items");
                if (!vaultContainer) {
                    console.error("Vault container not found!");
                    return;
                }

                console.log("Vault Data:", data);
    
                vaultContainer.innerHTML = data.vaultItems.length > 0
                    ? data.vaultItems.map(item => `
                        <div class="vault-item" title="${item.name}" draggable="true">
                            <img src="${item.icon}" class="item-icon" alt="Item">
                            <span class="power">${item.lightLevel}</span>
                        </div>
                    `).join("")
                    : "<p>No items found.</p>";
    
            } catch (error) {
                console.error("Failed to fetch vault data", error);
            }
        }
    
        
        
        fetchInventoryData('hunter');
        fetchInventoryData('warlock');
        fetchInventoryData('titan');
        fetchVaultData();
        fetchCharacterData();
    </script>
</body>
</html>
